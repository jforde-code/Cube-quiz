<!DOCTYPE html>
<html>
<head>
  <title>Cube Root Challenge</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin: 0;
      padding: 20px;
      background: #f5f7fb;
    }

    h1 {
      font-size: 1.8em;
      margin-bottom: 20px;
    }

    .correct { color: green; font-weight: bold; }
    .wrong { color: red; font-weight: bold; }

    #question {
      font-size: 1.4em;
      margin: 20px 0;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
    }

    #question.show {
      opacity: 1;
    }

    input {
      font-size: 1.2em;
      padding: 12px;
      width: 80%;
      max-width: 250px;
      border-radius: 10px;
      border: 1px solid #ccc;
      text-align: center;
    }

    button {
      font-size: 1.1em;
      padding: 12px 18px;
      margin: 10px 5px;
      border: none;
      border-radius: 10px;
      background: #4a7cff;
      color: white;
    }

    button:active {
      transform: scale(0.96);
    }

    #result {
      font-size: 1.3em;
      margin-top: 15px;
      min-height: 30px;
    }

    #streak {
      font-size: 1.2em;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<h1>Cube Root Challenge</h1>

<p id="question"></p>

<input type="number" id="answer" placeholder="Your answer" onkeydown="handleKey(event)">

<button id="submitBtn" onclick="checkAnswer()">Submit</button>

<button id="nextBtn" onclick="newQuestion()" style="display:none;">Next</button>

<p id="result"></p>
<p id="streak">Streak: 0</p>

<script>
let correctNumber;
let cubedNumber;
let streak = 0;

function newQuestion() {
  correctNumber = Math.floor(Math.random() * 90) + 10;
  cubedNumber = correctNumber ** 3;

  const q = document.getElementById("question");
  q.textContent = "What is the cube root of " + cubedNumber.toLocaleString() + "?";
  q.classList.remove("show");
  setTimeout(() => q.classList.add("show"), 50);

  document.getElementById("result").textContent = "";
  document.getElementById("answer").value = "";
  
document.getElementById("submitBtn").style.display = "inline-block";

document.getElementById("nextBtn").style.display = "none";
}

function handleKey(event) {
  if (event.key === "Enter") {
    checkAnswer();
  }
}

function checkAnswer() {
  const userAnswer = Number(document.getElementById("answer").value);
  const result = document.getElementById("result");

  if (userAnswer === correctNumber) {
    streak++;
    result.textContent = "Correct!";
    result.className = "correct";
    document.getElementById("streak").textContent = "Streak: " + streak;
    
document.getElementById("submitBtn").style.display = "none";

document.getElementById("nextBtn").style.display = "inline-block";
  } else {
    streak = 0;
    result.textContent = "Try again!";
    result.className = "wrong";
    document.getElementById("streak").textContent = "Streak: " + streak;
  }
}

// Start the first question
newQuestion();
</script>

</body>
</html>
